name: Build Windows release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Verify Windows update artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (-not (Test-Path "release/MM_LLM-$version-x64-Setup.exe")) { throw "Missing installer" }
          if (-not (Test-Path "release/latest.yml")) { throw "Missing update metadata" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
